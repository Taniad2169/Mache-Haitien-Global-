<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#074f94">
  <title>Haiti Business Directory</title>
  <style>
    /* --- BRAND COLORS & VARIABLES --- */
    :root {
      --brand-dark: #074f94;
      --brand-mid: #74b2ed;
      --brand-light: #15ace8;
      --gradient: linear-gradient(135deg, #074f94, #74b2ed, #15ace8);
      --text-dark: #333;
      --bg-white: #ffffff;
    }

    /* --- GLOBAL STYLES --- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--gradient);
      color: var(--text-dark);
      min-height: 100vh;
      padding: 20px 10px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* --- APP CONTAINER --- */
    .app-container {
      background: var(--bg-white);
      width: 100%;
      max-width: 600px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      overflow: hidden;
      padding: 20px;
      margin-bottom: 40px;
    }

    /* --- LOGO & HEADER --- */
    .logo-container {
      text-align: center;
      margin-bottom: 20px;
    }
    .logo-container img {
      max-width: 220px;
      height: auto;
    }

    /* --- YOUTUBE VIDEO --- */
    .video-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
      margin-bottom: 25px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* --- FORM STYLES --- */
    .form-group { margin-bottom: 18px; }
    label { 
      display: block; 
      font-weight: 600; 
      margin-bottom: 6px; 
      color: var(--brand-dark); 
      font-size: 14px;
    }
    select, input, textarea { 
      width: 100%; 
      padding: 12px; 
      border: 1.5px solid #ddd; 
      border-radius: 8px; 
      font-size: 15px; 
      background: #fafafa;
      transition: border 0.3s;
    }
    select:focus, input:focus, textarea:focus {
      border-color: var(--brand-light);
      outline: none;
      background: #fff;
    }
    textarea { resize: vertical; }

    /* --- CHECKBOX STYLING (For Social Media & Advertising) --- */
    .checkbox-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .checkbox-item {
      display: flex;
      align-items: center;
      background: #fafafa;
      padding: 10px;
      border-radius: 8px;
      border: 1.5px solid #ddd;
      cursor: pointer;
      transition: background 0.2s, border 0.2s;
    }
    .checkbox-item:active {
      background: #eef7ff;
      border-color: var(--brand-light);
    }
    .checkbox-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-right: 10px;
      accent-color: var(--brand-dark);
      cursor: pointer;
    }
    .checkbox-item span {
      font-size: 14px;
      font-weight: 500;
      color: #333;
    }

    /* --- CONDITIONAL FIELDS --- */
    .hidden { display: none !important; }
    .conditional-box {
      margin-top: 10px;
      padding: 12px;
      background: #f0f8ff;
      border-left: 4px solid var(--brand-light);
      border-radius: 0 8px 8px 0;
    }

    /* --- SUBMIT BUTTON --- */
    .submit-btn {
      background: var(--gradient);
      color: white;
      border: none;
      padding: 16px;
      width: 100%;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 4px 15px rgba(7, 79, 148, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .submit-btn:active {
      transform: scale(0.98);
      box-shadow: 0 2px 8px rgba(7, 79, 148, 0.4);
    }
  </style>
</head>

      locationLabel: "Ki kote ou ye:",
      stateLabel: "Chwazi Eta US:",

      adLabel: "Kijan w fè piblisite pou biznis ou?",

      commentLabel: "Kòmantè (400 mo max):",
      submitBtn: "Soumèt nan WhatsApp"
    }
  };

  // 2. TRANSLATION FUNCTION
  function changeLanguage() {
    const lang = document.getElementById('languageSelect').value;
    const elements = document.querySelectorAll('[data-key]');
    elements.forEach(el => {
      const key = el.getAttribute('data-key');
      if (translations[lang] && translations[lang][key]) {
        if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
          el.placeholder = translations[lang][key];
        } else {
          el.innerText = translations[lang][key];
        }
      }
    });
  }

  // 3. TOGGLE FUNCTIONS FOR CONDITIONAL FIELDS
  function toggleOther(select) {
    document.getElementById('otherBox').classList.toggle('hidden', select.value !== 'Other');
  }

  function toggleStates(select) {
    document.getElementById('stateBox').classList.toggle('hidden', select.value !== 'United States');
  }

  function toggleSocial(select) {
    document.getElementById('socialBox').classList.toggle('hidden', select.value !== 'Yes');
  }

  function toggleWhatsapp(select) {
    document.getElementById('whatsappBox').classList.toggle('hidden', select.value !== 'No');
  }

  // 4. WHATSAPP SUBMISSION LOGIC
  function submitToWhatsApp(event) {
    event.preventDefault();
    
    // Get values from form
    const industry = document.getElementById('industry').value;
    const otherText = document.getElementById('otherText').value;
    const years = document.getElementById('years').value;
    const country = document.getElementById('country').value;
    const state = document.getElementById('usState') ? document.getElementById('usState').value : '';
    const hasSocial = document.getElementById('hasSocial').value;
    
    // Get Checked Social Media Boxes
    const socialCheckboxes = document.querySelectorAll('input[name="social"]:checked');
    const socials = Array.from(socialCheckboxes).map(cb => cb.value).join(', ');

    // Get Checked Advertising Boxes (UPDATED)
    const adCheckboxes = document.querySelectorAll('input[name="advertise"]:checked');
    const advertise = Array.from(adCheckboxes).map(cb => cb.value).join(', ');
    
    const hasWhatsapp = document.getElementById('hasWhatsapp').value;
    const willingWhatsapp = document.getElementById('willingWhatsapp') ? document.getElementById('willingWhatsapp').value : 'N/A';
    const comments = document.getElementById('comments').value;

    // Build WhatsApp Message
    let message = `*New Business Directory Submission*\n\n`;
    message += `*Industry:* ${industry} ${otherText ? '(' + otherText + ')' : ''}\n`;
    message += `*Years in Business:* ${years}\n`;
    message += `*Location:* ${country} ${state ? '- ' + state : ''}\n`;
    message += `*Social Media:* ${hasSocial} ${socials ? '- ' + socials : ''}\n`;
    message += `*Advertising:* ${advertise}\n`;
    message += `*WhatsApp:* ${hasWhatsapp} ${hasWhatsapp === 'No' ? '(Willing to get: ' + willingWhatsapp + ')' : ''}\n`;
    message += `*Comments:* ${comments}\n`;

    // Encode and Open WhatsApp
    const phone = "16468988279"; // Your number with country code
    const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
    
    // Open in new tab (or WhatsApp app on mobile)
    window.open(url, '_blank');
  }

  // Initialize language on load
  window.onload = function() {
    changeLanguage();
  };
</script>
