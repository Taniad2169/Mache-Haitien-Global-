<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#074f94">
  <title>Haiti Business Directory</title>
  <style>
    /* --- BRAND COLORS & VARIABLES --- */
    :root {
      --brand-dark: #074f94;
      --brand-mid: #74b2ed;
      --brand-light: #15ace8;
      --gradient: linear-gradient(135deg, #074f94, #74b2ed, #15ace8);
      --text-dark: #333;
      --bg-white: #ffffff;
    }

    /* --- GLOBAL STYLES --- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--gradient);
      color: var(--text-dark);
      min-height: 100vh;
      padding: 20px 10px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* --- APP CONTAINER --- */
    .app-container {
      background: var(--bg-white);
      width: 100%;
      max-width: 600px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      overflow: hidden;
      padding: 20px;
      margin-bottom: 40px;
    }

    /* --- LOGO & HEADER --- */
    .logo-container {
      text-align: center;
      margin-bottom: 20px;
    }
    .logo-container img {
      max-width: 220px;
      height: auto;
    }

    /* --- YOUTUBE VIDEO --- */
    .video-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
      margin-bottom: 25px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* --- FORM STYLES --- */
    .form-group { margin-bottom: 18px; }
    label { 
      display: block; 
      font-weight: 600; 
      margin-bottom: 6px; 
      color: var(--brand-dark); 
      font-size: 14px;
    }
    select, input, textarea { 
      width: 100%; 
      padding: 12px; 
      border: 1.5px solid #ddd; 
      border-radius: 8px; 
      font-size: 15px; 
      background: #fafafa;
      transition: border 0.3s;
    }
    select:focus, input:focus, textarea:focus {
      border-color: var(--brand-light);
      outline: none;
      background: #fff;
    }
    textarea { resize: vertical; }

    /* --- CHECKBOX STYLING (For Social Media & Advertising) --- */
    .checkbox-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .checkbox-item {
      display: flex;
      align-items: center;
      background: #fafafa;
      padding: 10px;
      border-radius: 8px;
      border: 1.5px solid #ddd;
      cursor: pointer;
      transition: background 0.2s, border 0.2s;
    }
    .checkbox-item:active {
      background: #eef7ff;
      border-color: var(--brand-light);
    }
    .checkbox-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-right: 10px;
      accent-color: var(--brand-dark);
      cursor: pointer;
    }
    .checkbox-item span {
      font-size: 14px;
      font-weight: 500;
      color: #333;
    }

    /* --- CONDITIONAL FIELDS --- */
    .hidden { display: none !important; }
    .conditional-box {
      margin-top: 10px;
      padding: 12px;
      background: #f0f8ff;
      border-left: 4px solid var(--brand-light);
      border-radius: 0 8px 8px 0;
    }

    /* --- SUBMIT BUTTON --- */
    .submit-btn {
      background: var(--gradient);
      color: white;
      border: none;
      padding: 16px;
      width: 100%;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 4px 15px rgba(7, 79, 148, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .submit-btn:active {
      transform: scale(0.98);
      box-shadow: 0 2px 8px rgba(7, 79, 148, 0.4);
    }
  </style>
</head>

        <option value="">Select Duration</option>
        <option value="Starter">Starter</option>
        <option value="6 Months">6 Months</option>
        <option value="1 Year">1 Year</option>
        <option value="2 Years">2 Years</option>
        <option value="3 Years">3 Years</option>
        <option value="4 Years">4 Years</option>
        <option value="5 Years">5 Years</option>
        <option value="6 Years">6 Years</option>
        <option value="7 Years">7 Years</option>
        <option value="8 Years">8 Years</option>
        <option value="9 Years">9 Years</option>
        <option value="10+ Years">10+ Years</option>
      </select>
    </div>

    <!-- Location -->
    <div class="form-group">
      <label data-key="locationLabel">What is your location:</label>
      <select id="country" required onchange="toggleStates(this)">
        <option value="">Select Country</option>
        <option value="United States">United States</option>
        <option value="France">France</option>
        <option value="Haiti">Haiti</option>
        <option value="Canada">Canada</option>
        <option value="Brazil">Brazil</option>
        <option value="Dominican Republic">Dominican Republic</option>
        <option value="Puerto Rico">Puerto Rico</option>
      </select>
      
      <!-- US States Dropdown -->
      <div id="stateBox" class="conditional-box hidden">
        <label data-key="stateLabel">Select US State:</label>
        <select id="usState" required>
          <option value="">Select State</option>
          <option value="AL">Alabama</option><option value="AK">Alaska</option><option value="AZ">Arizona</option><option value="AR">Arkansas</option><option value="CA">California</option><option value="CO">Colorado</option><option value="CT">Connecticut</option><option value="DE">Delaware</option><option value="FL">Florida</option><option value="GA">Georgia</option><option value="HI">Hawaii</option><option value="ID">Idaho</option><option value="IL">Illinois</option><option value="IN">Indiana</option><option value="IA">Iowa</option><option value="KS">Kansas</option><option value="KY">Kentucky</option><option value="LA">Louisiana</option><option value="ME">Maine</option><option value="MD">Maryland</option><option value="MA">Massachusetts</option><option value="MI">Michigan</option><option value="MN">Minnesota</option><option value="MS">Mississippi</option><option value="MO">Missouri</option><option value="MT">Montana</option><option value="NE">Nebraska</option><option value="NV">Nevada</option><option value="NH">New Hampshire</option><option value="NJ">New Jersey</option><option value="NM">New Mexico</option><option value="NY">New York</option><option value="NC">North Carolina</option><option value="ND">North Dakota</option><option value="OH">Ohio</option><option value="OK">Oklahoma</option><option value="OR">Oregon</option><option value="PA">Pennsylvania</option><option value="RI">Rhode Island</option><option value="SC">South Carolina</option><option value="SD">South Dakota</option><option value="TN">Tennessee</option><option value="TX">Texas</option><option value="UT">Utah</option><option value="VT">Vermont</option><option value="VA">Virginia</option><option value="WA">Washington</option><option value="WV">West Virginia</option><option value="WI">Wisconsin</option><option value="WY">Wyoming</option>
        </select>
      </div>
    </div>

    <!-- Social Media (Checkboxes) -->
    <div class="form-group">
      <label data-key="socialLabel">Do you have social media?</label>
      <select id="hasSocial" required onchange="toggleSocial(this)">
        <option value="No">No</option>
        <option value="Yes">Yes</option>
      </select>
      
      <div id="socialBox" class="conditional-box hidden">
        <label data-key="socialSelectLabel">Select all that apply:</label>
        <div class="checkbox-group">
          <label class="checkbox-item"><input type="checkbox" name="social" value="Facebook"> <span>Facebook</span></label>
          <label class="checkbox-item"><input type="checkbox" name="social" value="Instagram"> <span>Instagram</span></label>
          <label class="checkbox-item"><input type="checkbox" name="social" value="LinkedIn"> <span>LinkedIn</span></label>
          <label class="checkbox-item"><input type="checkbox" name="social" value="TikTok"> <span>TikTok</span></label>
          <label class="checkbox-item"><input type="checkbox" name="social" value="X"> <span>X</span></label>
          <label class="checkbox-item"><input type="checkbox" name="social" value="Pinterest"> <span>Pinterest</span></label>
        </div>
      </div>
    </div>

    <!-- Advertising (NO REQUIRED - Optional) -->
    <div class="form-group">
      <label data-key="adLabel">How do you advertise for your business? (Optional)</label>
      <div class="checkbox-group">
        <label class="checkbox-item"><input type="checkbox" name="advertise" value="Radio"> <span>Radio</span></label>
        <label class="checkbox-item"><input type="checkbox" name="advertise" value="TV"> <span>TV</span></label>
        <label class="checkbox-item"><input type="checkbox" name="advertise" value="Online"> <span>Online</span></label>
        <label class="checkbox-item"><input type="checkbox" name="advertise" value="Word of Mouth"> <span>Word of Mouth</span></label>
        <label class="checkbox-item"><input type="checkbox" name="advertise" value="Referrals"> <span>Referrals</span></label>
      </div>
    </div>

    <!-- WhatsApp Logic -->
    <div class="form-group">
      <label data-key="whatsappLabel">Do you have WhatsApp?</label>
      <select id="hasWhatsapp" required onchange="toggleWhatsapp(this)">
        <option value="No">No</option>
        <option value="Yes">Yes</option>
      </select>
      <div id="whatsappBox" class="conditional-box hidden">
        <label data-key="whatsappWillingLabel">Are you willing to get WhatsApp for communication?</label>
        <select id="willingWhatsapp">
          <option value="Yes">Yes</option>
          <option value="No">No</option>
        </select>
      </div>
    </div>

    <!-- Comment Box -->
    <div class="form-group">
      <label data-key="commentLabel">Comments (400 words max):</label>
      <textarea id="comments" maxlength="2400" rows="5" placeholder="..."></textarea>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="submit-btn" data-key="submitBtn">Submit to WhatsApp</button>
  </form>
</div>

<script>
  // 1. TRANSLATIONS DATA
  const translations = {
    en: {
      langLabel: "Preferred Language:",
      ownerLabel: "Name of Owner:",
      businessLabel: "Business Name:",
      cityLabel: "City:",
      industryLabel: "Industry:",
      otherLabel: "If Other, please state (50 words max):",
      yearsLabel: "How long in business:",
      locationLabel: "What is your location:",
      stateLabel: "Select US State:",
      socialLabel: "Do you have social media?",
      socialSelectLabel: "Select all that apply:",
      adLabel: "How do you advertise for your business? (Optional)",
      whatsappLabel: "Do you have WhatsApp?",
      whatsappWillingLabel: "Are you willing to get WhatsApp for communication?",
      commentLabel: "Comments (400 words max):",
      submitBtn: "Submit to WhatsApp"
    },
    fr: {
      langLabel: "Langue Préférée:",
      ownerLabel: "Nom du Propriétaire:",
      businessLabel: "Nom de l'Entreprise:",
      cityLabel: "Ville:",
      industryLabel: "Industrie:",
      otherLabel: "Si Autre, veuillez préciser (50 mots max):",
      yearsLabel: "Depuis combien de temps en affaires:",
      locationLabel: "Quel est votre emplacement:",
      stateLabel: "Sélectionnez l'État américain:",
      socialLabel: "Avez-vous des réseaux sociaux?",
      socialSelectLabel: "Sélectionnez tout ce qui s'applique:",
      adLabel: "Comment faites-vous la publicité pour votre entreprise? (Optionnel)",
      whatsappLabel: "Avez-vous WhatsApp?",
      whatsappWillingLabel: "Êtes-vous prêt à obtenir WhatsApp pour la communication?",
      commentLabel: "Commentaires (400 mots max):",
      submitBtn: "Soumettre à WhatsApp"
    },
    ht: {
      langLabel: "Lang Preferans:",
      ownerLabel: "Non Pwopriyetè:",
      businessLabel: "Non Biznis:",
      cityLabel: "Vil:",
      industryLabel: "Endistri:",
      otherLabel: "Si Lòt, tanpri di (50 mo max):",
      yearsLabel: "Konbyen tan nan biznis:",
      locationLabel: "Ki kote ou ye:",
      stateLabel: "Chwazi Eta US:",
      socialLabel: "Èske w gen rezo sosyal?",
      socialSelectLabel: "Chwazi tout sa ki aplikab:",
      adLabel: "Kijan w fè piblisite pou biznis ou? (Opsyonèl)",
      whatsappLabel: "Èske w gen WhatsApp?",
      whatsappWillingLabel: "Èske w prè pou w jwenn WhatsApp pou kominikasyon?",
      commentLabel: "Kòmantè (400 mo max):",
      submitBtn: "Soumèt nan WhatsApp"
    }
  };

  // 2. TRANSLATION FUNCTION
  function changeLanguage() {
    const lang = document.getElementById('languageSelect').value;
    const elements = document.querySelectorAll('[data-key]');
    elements.forEach(el => {
      const key = el.getAttribute('data-key');
      if (translations[lang] && translations[lang][key]) {
        if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
          el.placeholder = translations[lang][key];
        } else {
          el.innerText = translations[lang][key];
        }
      }
    });
  }

  // 3. TOGGLE FUNCTIONS FOR CONDITIONAL FIELDS
  function toggleOther(select) {
    document.getElementById('otherBox').classList.toggle('hidden', select.value !== 'Other');
  }

  function toggleStates(select) {
    const stateBox = document.getElementById('stateBox');
    const stateSelect = document.getElementById('usState');
    if (select.value === 'United States') {
      stateBox.classList.remove('hidden');
      stateSelect.setAttribute('required', 'required');
    } else {
      stateBox.classList.add('hidden');
      stateSelect.removeAttribute('required');
      stateSelect.value = ''; // Reset state selection
    }
  }

  function toggleSocial(select) {
    document.getElementById('socialBox').classList.toggle('hidden', select.value !== 'Yes');
  }

  function toggleWhatsapp(select) {
    document.getElementById('whatsappBox').classList.toggle('hidden', select.value !== 'No');
  }

  // 4. WHATSAPP SUBMISSION LOGIC
  function submitToWhatsApp(event) {
    event.preventDefault();
    
    // Get values from form
    const ownerName = document.getElementById('ownerName').value;
    const businessName = document.getElementById('businessName').value;
    const city = document.getElementById('city').value;
    const industry = document.getElementById('industry').value;
    const otherText = document.getElementById('otherText').value;
    const years = document.getElementById('years').value;
    const country = document.getElementById('country').value;
    const state = document.getElementById('usState') ? document.getElementById('usState').value : '';
    const hasSocial = document.getElementById('hasSocial').value;
    
    // Get Checked Social Media Boxes
    const socialCheckboxes = document.querySelectorAll('input[name="social"]:checked');
    const socials = Array.from(socialCheckboxes).map(cb => cb.value).join(', ');

    // Get Checked Advertising Boxes (Optional)
    const adCheckboxes = document.querySelectorAll('input[name="advertise"]:checked');
    const advertise = Array.from(adCheckboxes).map(cb => cb.value).join(', ');
    
    const hasWhatsapp = document.getElementById('hasWhatsapp').value;
    const willingWhatsapp = document.getElementById('willingWhatsapp') ? document.getElementById('willingWhatsapp').value : 'N/A';
    const comments = document.getElementById('comments').value;

    // Build WhatsApp Message
    let message = `*New Business Directory Submission*\n\n`;
    message += `*Name of Owner:* ${ownerName}\n`;
    message += `*Business Name:* ${businessName}\n`;
    message += `*City:* ${city}\n`;
    message += `*Industry:* ${industry} ${otherText ? '(' + otherText + ')' : ''}\n`;
    message += `*Years in Business:* ${years}\n`;
    message += `*Location:* ${country} ${state ? '- ' + state : ''}\n`;
    message += `*Social Media:* ${hasSocial} ${socials ? '- ' + socials : ''}\n`;
    message += `*Advertising:* ${advertise || 'Not specified'}\n`;
    message += `*WhatsApp:* ${hasWhatsapp} ${hasWhatsapp === 'No' ? '(Willing to get: ' + willingWhatsapp + ')' : ''}\n`;
    message += `*Comments:* ${comments || 'None'}\n`;

    // Encode and Open WhatsApp
    const phone = "16468988279"; // Your number with country code
    const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
    
    // Open in new tab (or WhatsApp app on mobile)
    window.open(url, '_blank');
  }

  // Initialize language on load and handle state required toggle
  window.onload = function() {
    changeLanguage();
    // Ensure state box is hidden on load if US not selected
    toggleStates(document.getElementById('country'));
  };
</script>

</body>
</html>
